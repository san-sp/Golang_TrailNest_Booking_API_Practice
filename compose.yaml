services:
  db:
    image: postgres:17-alpine
    container_name: trailnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - trailnest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trailnest-api
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/app/.env:ro
      - trailnest_uploads:/app/uploads
    environment:
      PORT: '8080'
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: trailnest-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - trailnest_prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.4
    container_name: trailnest-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - trailnest_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  trailnest_postgres_data:
  trailnest_uploads:
  trailnest_prometheus_data:
  trailnest_grafana_data:
