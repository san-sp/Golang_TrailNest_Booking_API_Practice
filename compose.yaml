services:
  db:
    image: postgres:17-alpine
    container_name: trailnest-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - trailnest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trailnest-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    env_file:
      - .env.docker
    volumes:
      - trailnest_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--output-document=/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: '8080'
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: trailnest-prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - trailnest_prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.4
    container_name: trailnest-grafana
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 256
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - trailnest_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  trailnest_postgres_data:
  trailnest_uploads:
  trailnest_prometheus_data:
  trailnest_grafana_data:
