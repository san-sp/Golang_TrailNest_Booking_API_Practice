name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, Vet, and PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailnest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailnest_test?sslmode=disable
      RESERVATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailnest_expiry_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "These Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "All tracked Go files are formatted."

      - name: Run go vet
        run: go vet ./...

      - name: Create reservation expiry test database
        run: |
          psql -v ON_ERROR_STOP=1 \
            -d postgres \
            -c "CREATE DATABASE trailnest_expiry_test;"

      - name: Apply database migrations
        shell: bash
        run: |
          set -Eeuo pipefail

          for database in trailnest_test trailnest_expiry_test; do
            echo "Applying migrations to ${database}..."

            for migration in migrations/*.up.sql; do
              echo "  -> ${migration}"
              psql -v ON_ERROR_STOP=1 \
                -d "$database" \
                -f "$migration"
            done
          done

      - name: Verify test database connections
        run: |
          psql -v ON_ERROR_STOP=1 -d trailnest_test \
            -c "SELECT current_database();"
          psql -v ON_ERROR_STOP=1 -d trailnest_expiry_test \
            -c "SELECT current_database();"

      - name: Run complete Go test suite
        run: go test ./... -count=1

      - name: Run Go tests with race detector
        run: go test -race ./... -count=1
